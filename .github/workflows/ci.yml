name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Datasets
        uses: actions/checkout@v7

      - name: Check out pinned Tokenizer admission verifier
        uses: actions/checkout@v7
        with:
          repository: CyberSecGPT/cybersecgpt-tokenizer
          ref: 0d3b1bff2328392a5b385b0c5b2bd7d08177b792
          path: .peer/cybersecgpt-tokenizer
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m black --check .

      - name: Run strict mypy
        run: python -m mypy src scripts

      - name: Validate repository security and dependency boundaries
        run: python scripts/validate_repository.py

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify split-package import
        run: python -c "import cybersecgpt.datasets"

      - name: Run tests with 100% source coverage
        run: >-
          python -m pytest
          --cov=cybersecgpt.datasets
          --cov-report=term-missing
          --cov-fail-under=100

      - name: Verify exact first-party snapshot admission offline
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.peer/cybersecgpt-tokenizer/src
        run: python scripts/verify_first_party_snapshot_admission.py

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Datasets
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution boundaries
        run: python scripts/verify_distribution.py dist
